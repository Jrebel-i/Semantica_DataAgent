[project]
name = "semantica-dataagent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy>=2.0", "alembic>=1.14", "cryptography>=44", "neo4j>=5.28,<6", "pymilvus>=2.5,<3", "httpx>=0.28"]
[project.scripts]
semantica-dataagent = "semantica_dataagent.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
