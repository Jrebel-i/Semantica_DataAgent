- name: air_orders_d
  source: hive.dwd.air_orders_d
  description: 机票订单
  ai_context:
    instructions: '分区策略：merge_onself 合并更新

      分区策略：全量快照分区（INSERT OVERWRITE，查询最新状态请限定 MAX(分区列)）

      直接上游表：hive.ods.air_orders_raw'
  fields:
  - name: amount
    expression:
      sql: amount
    datatype: Decimal
    nonportable_extensions:
    - vendor_name: SEMANTICA_DATAAGENT
      data:
        partition: false
        raw_type: decimal(18,2)
    description: 金额
  - name: day_num
    expression:
      sql: day_num
    datatype: String
    nonportable_extensions:
    - vendor_name: SEMANTICA_DATAAGENT
      data:
        partition: true
        raw_type: string
    description: 分区日期
  - name: order_id
    expression:
      sql: order_id
    datatype: String
    nonportable_extensions:
    - vendor_name: SEMANTICA_DATAAGENT
      data:
        partition: false
        raw_type: string
    description: 订单号
