version: 0.3.0.dev0
name: issue342
datasets:
- name: dim_airport
  source: hive.dimensions.dim_airport
  description: 机场维度
  fields:
  - name: airport_code
    expression:
      sql: airport_code
    datatype: String
    nonportable_extensions:
    - vendor_name: SEMANTICA_DATAAGENT
      data:
        partition: false
        raw_type: string
    description: 三字码
    ai_context:
      instructions: 示例取值（共 2 个去重值，抽样前 2 个）：' PVG ', 'SHA'
  - name: airport_name
    expression:
      sql: airport_name
    datatype: String
    nonportable_extensions:
    - vendor_name: SEMANTICA_DATAAGENT
      data:
        partition: false
        raw_type: string
    description: 机场名
    ai_context:
      instructions: 示例取值（共 3 个去重值，抽样前 3 个）：'未知机场', '浦东机场', '虹桥机场'
  - name: region
    expression:
      sql: region
    datatype: String
    nonportable_extensions:
    - vendor_name: SEMANTICA_DATAAGENT
      data:
        partition: false
        raw_type: string
    description: 区域
    ai_context:
      instructions: 全部取值（共 1 个）：'华东'
