  expected_tables: [shop.orders]
  expected_fields: [shop.orders.id]
  caliber: "订单数按订单编号去重统计已创建订单，避免同一订单多行导致重复计数。"
  reference_sql: "SELECT COUNT(DISTINCT id) AS order_count FROM shop.orders"
  notes: "出处：samples/demo/knowledge/metrics/orders.md（按订单编号去重统计已创建订单）；samples/demo/knowledge/operations/dictionaries/shop.orders.md（订单编号关联订单明细）。"
- id: d30
  question: "订单表是由哪个上游任务加载的？"
  expected_tables: [shop.orders]
  expected_fields: [shop.orders.id, shop.orders.dt]
  caliber: "shop.orders 由 load_orders 从 staging.orders 加载；查询订单表本身以确认分析对象存在。"
  reference_sql: "SELECT id, dt FROM shop.orders WHERE dt >= '2025-01-01'"
  notes: "出处：samples/demo/tasks.json load_orders（INSERT OVERWRITE TABLE shop.orders ... FROM staging.orders）；samples/demo/lineage.json staging.orders -> shop.orders。"
