- id: d01
  question: "我们现在一共有多少笔交易订单？"
  expected_tables: [shop.orders]
  expected_fields: [shop.orders.id]
  caliber: "订单数按订单编号去重；样例表以 id 作为订单编号。"
  reference_sql: "SELECT COUNT(DISTINCT id) AS order_count FROM shop.orders"
  notes: "出处：samples/demo/tables.json shop.orders（交易订单）；samples/demo/knowledge/metrics/orders.md（按订单编号去重）。"
- id: d02
  question: "每天分别有多少笔订单？"
  expected_tables: [shop.orders]
  expected_fields: [shop.orders.id, shop.orders.dt]
  caliber: "按日期分区 dt 分组，订单编号去重计数。"
  reference_sql: "SELECT dt, COUNT(DISTINCT id) AS order_count FROM shop.orders GROUP BY dt"
  notes: "出处：samples/demo/fields.json shop.orders.dt（日期分区）；samples/demo/knowledge/metrics/orders.md。"
