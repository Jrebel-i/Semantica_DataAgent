  expected_tables: [shop.orders]
  expected_fields: [shop.orders.id]
  caliber: "订单数按订单编号去重统计已创建订单；取消订单是否纳入需要按业务问题明确。"
  reference_sql: "SELECT COUNT(DISTINCT id) AS order_count FROM shop.orders"
  clarify: true
  notes: "出处：samples/demo/knowledge/metrics/orders.md（取消订单是否纳入需明确）。"
- id: d28
  question: "销售额要不要扣掉退款？净额怎么算？"
  expected_tables: [shop.payments, shop.refunds]
  expected_fields: [shop.payments.id, shop.refunds.id]
  caliber: "全额退款从净支付销售额扣除，部分退款按实际退款金额扣除；问题未说明全额/部分及日期口径时应澄清。"
  reference_sql: "SELECT id AS payment_id FROM shop.payments WHERE id NOT IN (SELECT id FROM shop.refunds)"
  clarify: true
  notes: "出处：samples/demo/knowledge/metrics/definitions/sales.md（退款处理：全额扣除、部分按实际金额、退款日与支付日不同）。"
- id: d29
