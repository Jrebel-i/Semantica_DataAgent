- id: d24
  question: "订单数据会流到每日销售额表吗？按订单编号看一下两边能对上的记录。"
  expected_tables: [shop.orders, shop.daily_sales]
  expected_fields: [shop.orders.id, shop.daily_sales.id]
  caliber: "load_daily_sales 任务把 shop.orders 写入 shop.daily_sales，按订单编号 id 关联；该血缘关系为强证据。"
  reference_sql: "SELECT id AS order_id FROM shop.orders WHERE id IN (SELECT id FROM shop.daily_sales)"
  notes: "出处：samples/demo/tasks.json load_daily_sales（INSERT INTO shop.daily_sales SELECT * FROM shop.orders）；samples/demo/lineage.json 强血缘边。"
- id: d25
  question: "哪些订单已经产生了支付流水？"
  expected_tables: [shop.orders, shop.payments]
  expected_fields: [shop.orders.id, shop.payments.id]
  caliber: "订单业务编号出现在支付流水中；用 IN 子查询表示关联，避免假设支付流水字段结构。"
  reference_sql: "SELECT id AS order_id FROM shop.orders WHERE id IN (SELECT id FROM shop.payments)"
  notes: "出处：samples/demo/tables.json shop.orders（交易订单）与 shop.payments（支付流水）；samples/demo/fields.json 两表 id 均为业务编号。"
- id: d26
  question: "统计销售额时要按支付成功时间还是下单时间？"
  expected_tables: [shop.orders, shop.payments]
  expected_fields: [shop.orders.id, shop.payments.id]
  caliber: "支付销售额按支付成功时间归属，下单销售额按订单创建时间归属，两者不可混用；问题口径不明确应澄清。"
  reference_sql: "SELECT id AS order_id FROM shop.orders WHERE id IN (SELECT id FROM shop.payments)"
  clarify: true
  notes: "出处：samples/demo/knowledge/metrics/definitions/sales.md（按支付成功时间汇总）；samples/demo/knowledge/metrics/sales_order.md（按订单创建时间，且应澄清）。"
- id: d27
