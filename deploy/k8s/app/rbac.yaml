apiVersion: v1
kind: ServiceAccount
metadata:
  name: dataagent
  namespace: semantica-dataagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dataagent-sessions
  namespace: semantica-dataagent-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dataagent-sessions
  namespace: semantica-dataagent-sessions
subjects:
  - kind: ServiceAccount
    name: dataagent
    namespace: semantica-dataagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dataagent-sessions
