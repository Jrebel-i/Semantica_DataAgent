apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dataagent-session-egress
  namespace: semantica-dataagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent-session
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: dataagent
      ports:
        - protocol: TCP
          port: 8000
    # FQDN policies are unavailable in standard Kubernetes. The per-Pod
    # iptables rules further restrict this broad TCP allowance to resolved IPs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
