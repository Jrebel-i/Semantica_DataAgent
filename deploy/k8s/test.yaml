apiVersion: v1
kind: Namespace
metadata:
  name: semantica-dataagent-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-embedded
  namespace: semantica-dataagent-test
data:
  embedEtcd.yaml: |
    listen-client-urls: http://127.0.0.1:2379
    advertise-client-urls: http://127.0.0.1:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: '1000'
  user.yaml: |
    # Defaults from the pinned Milvus image.
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: semantica-dataagent-test
spec:
  type: NodePort
  selector:
    app: neo4j
  ports:
  - port: 7687
    targetPort: 7687
    nodePort: 31611
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: semantica-dataagent-test
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      enableServiceLinks: false
      containers:
      - name: neo4j
        image: neo4j:5.26-community
        imagePullPolicy: IfNotPresent
        env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: neo4j-auth
              key: auth
        - name: NEO4J_dbms_usage__report_enabled
          value: "false"
        - name: NEO4J_server_memory_heap_initial__size
          value: 256m
        - name: NEO4J_server_memory_heap_max__size
          value: 512m
        - name: NEO4J_server_memory_pagecache_size
          value: 128m
        ports:
        - containerPort: 7687
        readinessProbe:
          tcpSocket:
            port: 7687
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: semantica-dataagent-test
spec:
  type: NodePort
  selector:
    app: milvus
  ports:
  - port: 19530
    targetPort: 19530
    nodePort: 31612
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  namespace: semantica-dataagent-test
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      enableServiceLinks: false
      containers:
      - name: milvus
        image: milvusdb/milvus:v2.5.27
        imagePullPolicy: IfNotPresent
        command: ["milvus", "run", "standalone"]
        env:
        - name: ETCD_USE_EMBED
          value: "true"
        - name: ETCD_DATA_DIR
          value: /var/lib/milvus/etcd
        - name: ETCD_CONFIG_PATH
          value: /milvus/configs/embedEtcd.yaml
        - name: COMMON_STORAGETYPE
          value: local
        ports:
        - containerPort: 19530
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9091
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/milvus
        - name: config
          mountPath: /milvus/configs/embedEtcd.yaml
          subPath: embedEtcd.yaml
        - name: config
          mountPath: /milvus/configs/user.yaml
          subPath: user.yaml
      volumes:
      - name: config
        configMap:
          name: milvus-embedded
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
