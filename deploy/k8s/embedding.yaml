apiVersion: v1
kind: Service
metadata:
  name: embedding
  namespace: semantica-dataagent
spec:
  type: NodePort
  selector:
    app: embedding
  ports:
  - port: 7997
    targetPort: 7997
    nodePort: 31603
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: embedding-pool
  namespace: semantica-dataagent
spec:
  serviceName: embedding
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: embedding
  template:
    metadata:
      labels:
        app: embedding
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: embedding
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: download-and-verify
        image: python:3.11-slim
        command: [python, /integrity/model.py, download]
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: model
          mountPath: /model
        - name: integrity
          mountPath: /integrity
      containers:
      - name: infinity
        image: michaelf34/infinity:0.0.77-cpu
        command: ["/bin/sh", "-c"]
        args:
        - python /integrity/model.py && exec infinity_emb v2 --model-id /model/bge-m3 --engine torch --batch-size 16 --port 7997 --host 0.0.0.0
        env:
        - name: DO_NOT_TRACK
          value: "1"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        ports:
        - containerPort: 7997
        readinessProbe:
          httpGet:
            path: /health
            port: 7997
          periodSeconds: 10
        resources:
          requests:
            cpu: 2
            memory: 2Gi
          limits:
            memory: 4Gi
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: integrity
          mountPath: /integrity
      volumes:
      - name: integrity
        configMap:
          name: embedding-integrity
  volumeClaimTemplates:
  - metadata:
      name: model
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
