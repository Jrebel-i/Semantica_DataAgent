services:
  model-download:
    image: python:3.11-slim
    command: [python, /integrity/model.py, download]
    volumes:
      - ${EMBEDDING_MODEL_DIR:-${HOME}/.cache/semantica-dataagent/bge-m3}:/model/bge-m3
      - ./k8s/model.py:/integrity/model.py:ro
  embedding:
    image: michaelf34/infinity:0.0.77-cpu
    depends_on:
      model-download:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command: python /integrity/model.py && exec infinity_emb v2 --model-id /model/bge-m3 --engine torch --batch-size 2 --port 7997 --host 0.0.0.0
    environment:
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - 127.0.0.1:17997:7997
    mem_limit: 4g
    restart: unless-stopped
    volumes:
      - ${EMBEDDING_MODEL_DIR:-${HOME}/.cache/semantica-dataagent/bge-m3}:/model/bge-m3:ro
      - ./k8s/model.py:/integrity/model.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 120s
