namespace: semantica-dataagent-test
resources:
  - ../k8s
patches:
  - target:
      kind: Service
      name: embedding
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31613
  - target:
      kind: Deployment
      name: embedding
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [k8s-worker-02]
              - weight: 50
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: [k8s-worker-01]
